name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -q OBSR.zip -d project

      - name: Fix onStart name clash
        run: sed -i 's/onStart()/onStartClicked()/g' project/app/src/main/java/com/presence/companion/MainActivity.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: project
        run: |
          gradle assembleDebug --console=plain > build.log 2>&1 && exit 0
          echo "===== ОШИБКИ СБОРКИ ====="
          grep -E "^e: |error:|What went wrong|FAILED" -A4 build.log | head -60
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: OBSR-debug-apk
          path: project/app/build/outputs/apk/debug/*.apk
